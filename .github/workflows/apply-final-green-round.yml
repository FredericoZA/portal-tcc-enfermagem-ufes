name: Apply final green round

on:
  push:
    branches:
      - fix/final-green-round-20260928

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/final-green-round-20260928
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Aplicar correções estruturais
        run: |
          node scripts/apply-final-green-round.mjs
          node scripts/apply-final-green-round-2.mjs
      - name: Alinhar npm
        run: npm install --global npm@11.9.0
      - name: Instalar dependências
        run: npm ci
      - name: Validar CI completo
        run: npm run test:ci
      - name: Validar fluxo seguro
        run: npm run test:secure-flow
      - name: Instalar Chromium para homologação visual
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Homologar interface em navegador real
        run: npm run test:visual
      - name: Commitar somente após tudo verde
        run: |
          git config user.name "Portal TCC Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Portal TCC 1.0.48 — fecha rodada de interface e acesso"
          git push origin HEAD:fix/final-green-round-20260928
