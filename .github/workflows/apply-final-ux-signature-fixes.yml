name: Apply final UX signature fixes

on:
  push:
    branches:
      - fix/padronizacao-visual-e-contingencia-assinaturas
    paths:
      - scripts/apply-final-ux-signature-fixes.mjs
      - scripts/fix-generated-govbr.mjs
      - .github/workflows/apply-final-ux-signature-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/padronizacao-visual-e-contingencia-assinaturas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Aplicar correções
        run: |
          node scripts/apply-final-ux-signature-fixes.mjs
          node scripts/fix-generated-govbr.mjs
      - name: Validar CI
        run: npm run test:ci
      - name: Validar fluxo seguro
        run: npm run test:secure-flow
      - name: Publicar alterações na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Portal TCC automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/index.css src/pages/ConfiguracoesPage.tsx src/pages/HomePage.tsx src/pages/ProcessoDetailPage.tsx src/services/apiClient.ts server/integrations/supabaseStorageStaging.ts server.ts
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional."
            exit 0
          fi
          git commit -m "feat: conclui padronização visual e contingência Gov.br"
          git push origin HEAD:fix/padronizacao-visual-e-contingencia-assinaturas
