name: Apply global UI refactor 2026-09-26

on:
  push:
    branches:
      - refactor/global-ui-configuration-2026-09-26

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/global-ui-configuration-2026-09-26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply structural refactor
        run: node scripts/apply-global-ui-refactor-20260926.mjs
      - name: Secrets check
        run: npm run test:secrets
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Contract tests
        run: npm run test:contracts
      - name: Accessibility tests
        run: npm run test:a11y
      - name: Finalization contract
        run: npm run test:finalization
      - name: Production build
        run: npm run build
      - name: HTTP build test
        run: npm run test:http
      - name: Commit validated source changes
        run: |
          if git diff --quiet; then
            echo "No generated source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor: aplica reforma estrutural global da interface"
          git push origin HEAD:refactor/global-ui-configuration-2026-09-26
