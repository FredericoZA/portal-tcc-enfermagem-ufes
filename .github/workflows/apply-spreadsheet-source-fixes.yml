name: Apply Spreadsheet Source Fixes

on:
  push:
    branches:
      - work/finalizacao-portal-tcc

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch de homologação
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/planilhas-1054-homologacao
          persist-credentials: true
          fetch-depth: 0

      - name: Corrigir agendamento do runtime e rótulo Processo na fonte
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/components/PortalSpreadsheetRuntime.tsx')
          text = runtime.read_text()
          old = """    const schedule = () => {\n      cancelAnimationFrame(frame);\n      frame = requestAnimationFrame(enhanceAll);\n    };"""
          new = """    const schedule = () => {\n      if (frame) return;\n      frame = requestAnimationFrame(() => {\n        frame = 0;\n        enhanceAll();\n      });\n    };"""
          if old not in text:
              raise SystemExit('Bloco antigo de schedule não encontrado; não aplicar patch às cegas.')
          runtime.write_text(text.replace(old, new))

          home = Path('src/pages/HomePage.tsx')
          source = home.read_text()
          if 'Nº do Processo' not in source:
              raise SystemExit('Rótulo Nº do Processo não encontrado na fonte; revisar antes de alterar.')
          home.write_text(source.replace('Nº do Processo', 'Processo'))
          PY

      - name: Validar diff esperado
        run: |
          git diff --check
          git diff -- src/components/PortalSpreadsheetRuntime.tsx src/pages/HomePage.tsx

      - name: Commitar correção no branch de homologação
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PortalSpreadsheetRuntime.tsx src/pages/HomePage.tsx
          git commit -m 'fix: garantir ativação do runtime tabular'
          git push origin HEAD:fix/planilhas-1054-homologacao
