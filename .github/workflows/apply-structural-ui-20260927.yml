name: Apply structural UI 2026-09-27

on:
  push:
    branches:
      - refactor/global-ui-configuration-2026-09-26
    paths:
      - 'scripts/apply-ui-consolidation-20260927.mjs'
      - '.github/workflows/apply-structural-ui-20260927.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/global-ui-configuration-2026-09-26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply structural refactor
        run: node scripts/apply-ui-consolidation-20260927.mjs
      - name: TypeScript
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Commit deterministic changes
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'Portal TCC CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src scripts docs
          git commit -m 'refactor: aplica consolidação estrutural de UI [ui-applied]'
          git push origin HEAD:refactor/global-ui-configuration-2026-09-26
