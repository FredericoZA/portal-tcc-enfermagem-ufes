name: Apply Update 33 Student Rule
on:
  push:
    branches: [update-33-restricted-area]
    paths: [scripts/apply-update33-student-rule.mjs]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update-33-restricted-area
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/apply-update33-student-rule.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualização 33 — garantir um TCC por aluno"
          git push origin HEAD:update-33-restricted-area
