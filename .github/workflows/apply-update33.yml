name: Apply Update 33

on:
  push:
    branches:
      - update-33-restricted-area
    paths:
      - scripts/apply-update33-fix.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update-33-restricted-area
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar alterações da atualização 33
        run: node scripts/apply-update33-fix.mjs
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi
          git commit -m "Atualização 33 — reorganizar áreas restritas e indicadores públicos"
          git push origin HEAD:update-33-restricted-area
