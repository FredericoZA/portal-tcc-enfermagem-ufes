name: Apply Update 34
on:
  push:
    branches: [update-34-polish-workflows]
    paths:
      - 'scripts/apply-update34.mjs'
      - '.github/workflows/apply-update34.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update-34-polish-workflows
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar atualização 34
        run: node scripts/apply-update34.mjs
      - name: Validar TypeScript antes do commit
        run: |
          npm ci
          npm run lint
      - name: Commitar alterações consolidadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-update34.mjs .github/workflows/apply-update34.yml
          git add -A
          git commit -m "Atualização 34 — aplicar polimento estrutural e operacional"
          git push origin HEAD:update-34-polish-workflows
