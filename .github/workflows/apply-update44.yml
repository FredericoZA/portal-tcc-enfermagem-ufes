name: Aplicar atualização 44

on:
  push:
    branches: [work/ajustes-planilhas-presidente-v1038]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[apply-update44]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/ajustes-planilhas-presidente-v1038
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar patch consolidado
        run: node scripts/apply-update44.mjs
      - name: Commitar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar ajustes finais de planilhas e Presidência [apply-update44]"
          git push origin HEAD:work/ajustes-planilhas-presidente-v1038
