name: Apply UX and signature upgrade

on:
  push:
    branches: [fix/ux-standard-gov-signature]
    paths:
      - scripts/apply-ux-signature-upgrade.mjs
      - scripts/fix-ux-signature-upgrade.mjs
      - .github/workflows/apply-ux-signature-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-standard-gov-signature
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar melhorias
        run: |
          node scripts/apply-ux-signature-upgrade.mjs
          node scripts/fix-ux-signature-upgrade.mjs
      - name: Validar CI
        run: npm run test:ci
      - name: Validar fluxo seguro
        run: npm run test:secure-flow
      - name: Commitar melhorias
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Portal TCC automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/components/Sidebar.tsx src/components/Header.tsx src/pages/PortalTutorialPage.tsx src/components/AuthorizedStudentsPanel.tsx src/components/InfrastructureIntegrationsPanel.tsx src/components/AuditAndSecuritySection.tsx src/constants/installation.ts src/types/signatures.ts server/integrations/supabaseStorageStaging.ts src/services/apiClient.ts src/pages/ProcessoDetailPage.tsx src/pages/HomePage.tsx src/pages/IndicadoresPage.tsx src/pages/ConfiguracoesPage.tsx api/index.ts server.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: padroniza UX e adiciona assinatura Gov.br"
          git push origin HEAD:fix/ux-standard-gov-signature
