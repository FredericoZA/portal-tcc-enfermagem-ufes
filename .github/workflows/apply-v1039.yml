name: Aplicar lote 1.0.39

on:
  push:
    branches:
      - fix/linha-branca-lista-defesas-1039

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/linha-branca-lista-defesas-1039
          fetch-depth: 0
      - name: Aplicar correções consolidadas
        run: python scripts/apply-v1039.py
      - name: Validar TypeScript antes do commit
        run: |
          npm ci
          npm run lint
      - name: Commitar lote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidar versão 1.0.39 [v1039-applied]"
          git push origin HEAD:fix/linha-branca-lista-defesas-1039
