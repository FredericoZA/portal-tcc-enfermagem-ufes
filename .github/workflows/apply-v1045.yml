name: Apply v1.0.45 structural migration
on:
  push:
    branches: [v1-0-45]
    paths:
      - scripts/apply-v1045.mjs
      - .github/workflows/apply-v1045.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-0-45
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar migrador estrutural
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-v1045.mjs')
          s = p.read_text()
          # Indicadores e registros de assinatura têm implementação própria e validável no branch.
          for start_marker, end_marker in [
              ('// 11) Indicadores:', '// 12) CSS canônico 1.0.45:'),
              ('// 8) Registros de assinatura:', '// 9) Sidebar:'),
          ]:
              start = s.index(start_marker)
              end = s.index(end_marker, start)
              s = s[:start] + s[end:]
          p.write_text(s)
          PY
      - name: Aplicar migração estrutural 1.0.45
        run: node scripts/apply-v1045.mjs
      - name: Validar e registrar alterações
        run: |
          npm ci
          npm run test:ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-v1045.mjs .github/workflows/apply-v1045.yml
          git add -A
          git commit -m "Portal TCC 1.0.45 — reforma estrutural de UX"
          git push origin HEAD:v1-0-45
