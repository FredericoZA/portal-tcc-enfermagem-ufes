name: Apply v1.0.46 structural migration
on:
  push:
    branches: [v1-0-46]
    paths:
      - scripts/apply-v1046.py
      - .github/workflows/apply-v1046.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-0-46
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar migração estrutural 1.0.46
        run: python scripts/apply-v1046.py
      - name: Alinhar contratos históricos
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Trecho esperado ausente em {path}: {old[:80]}')
              p.write_text(s.replace(old, new, 1))

          # Somente o contrato da versão corrente deve fixar package.json em 1.0.46.
          # Testes históricos continuam verificando os recursos que introduziram, sem
          # transformar um número de release antigo em uma trava para releases futuras.
          patch(
              'server/update33CompletionContract.test.ts',
              "const pkg=JSON.parse(await source('package.json'));assert.equal(pkg.version,'1.0.45');for(const file of",
              "for(const file of",
          )
          patch(
              'server/update44FinalPolishContract.test.ts',
              "  const pkg=JSON.parse(read('package.json'));\n",
              "",
          )
          patch(
              'server/update44FinalPolishContract.test.ts',
              "  assert.equal(pkg.version,'1.0.45');\n",
              "",
          )
          patch(
              'server/update45Version1039Contract.test.ts',
              "\ntest('release atual está marcado como 1.0.44',()=>{\n  const pkg=JSON.parse(read('package.json'));\n  assert.equal(pkg.version,'1.0.45');\n});",
              "",
          )
          patch(
              'server/version1042Contract.test.ts',
              "\ntest('package publica a versão 1.0.44',()=>{\n  const pkg=JSON.parse(read('package.json'));\n  assert.equal(pkg.version,'1.0.45');\n});",
              "",
          )
          patch(
              'server/version1043StructuralUiContract.test.ts',
              "  const pkg=JSON.parse(read('package.json'));\n",
              "",
          )
          patch(
              'server/version1043StructuralUiContract.test.ts',
              "  assert.equal(pkg.version,'1.0.45');\n",
              "",
          )

          # O preview DOM paralelo foi removido deliberadamente: ele duplicava o estado
          # React do calendário e introduzia latência/race condition ao buscar /api/processes.
          p = Path('server/update43SpreadsheetContract.test.ts')
          s = p.read_text()
          old = """  assert.match(runtime, /portal-core-calendar-card/);\n  assert.match(runtime, /title\\.textContent = `HOMOLOGAÇÃO/);\n  assert.match(runtime, /meta\\.textContent =/);"""
          new = """  assert.match(runtime, /portal-core-calendar-weekend/);\n  assert.match(runtime, /cell\\.querySelector\\('\\.portal-core-calendar-previews'\\)\\?\\.remove\\(\\)/);\n  assert.doesNotMatch(runtime, /fetch\\('\\/api\\/processes'/);"""
          if old not in s:
              raise SystemExit('Contrato antigo de preview do calendário não encontrado')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validar e registrar alterações
        run: |
          npm ci
          npm run test:ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-v1046.py .github/workflows/apply-v1046.yml
          git add -A
          git commit -m "Portal TCC 1.0.46 — consolidação estrutural de UX"
          git push origin HEAD:v1-0-46
