name: Apply v1048 admin UX

on:
  push:
    branches:
      - fix/config-calendar-admin-ux-v1048

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/config-calendar-admin-ux-v1048
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic changes
        run: node scripts/apply-v1048-admin-ux.mjs
      - name: Secrets check
        run: npm run test:secrets
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Contract tests
        run: npm run test:contracts
      - name: Accessibility static tests
        run: npm run test:a11y
      - name: Finalization contract
        run: npm run test:finalization
      - name: Production build
        run: npm run build
      - name: HTTP build test
        run: npm run test:http
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/apiClient.ts src/components/IntegrationStudioPanel.tsx src/pages/HomePage.tsx
          git commit -m "refactor: consolida UX de configurações e calendário"
          git push origin HEAD:fix/config-calendar-admin-ux-v1048
