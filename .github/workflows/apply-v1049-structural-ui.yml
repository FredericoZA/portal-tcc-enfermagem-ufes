name: Apply v1049 structural UI

on:
  push:
    branches:
      - refactor/global-ui-configuration-v1049

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/global-ui-configuration-v1049
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply structural changes
        run: node scripts/apply-v1049-structural-ui.mjs
      - name: Secrets check
        run: npm run test:secrets
      - name: TypeScript check
        run: npm run lint
      - name: v1049 structural contract
        run: node --import tsx --test server/version1049StructuralUiContract.test.ts
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm run test:unit 2>&1 | tee unit-tests-v1049.log
      - name: Persist unit diagnostics
        if: steps.unit.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unit-tests-v1049.log
          git commit -m "test: captura diagnóstico unitário v1049"
          git push origin HEAD:refactor/global-ui-configuration-v1049
          exit 1
      - name: Contract tests
        run: npm run test:contracts
      - name: Accessibility static tests
        run: npm run test:a11y
      - name: Finalization contract
        run: npm run test:finalization
      - name: Production build
        run: npm run build
      - name: HTTP build test
        run: npm run test:http
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src server/version1049StructuralUiContract.test.ts docs/REFATORACAO_ESTRUTURAL_UI_CONFIGURACOES_2026-09-27.md
          git commit -m "refactor: aplica contrato estrutural de UI e configurações"
          git push origin HEAD:refactor/global-ui-configuration-v1049
