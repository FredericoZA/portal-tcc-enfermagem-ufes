name: Canonicalize public policy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/canonicalize-public-policy.mjs'
      - '.github/workflows/canonicalize-public-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply canonical policy migration
        run: node scripts/canonicalize-public-policy.mjs
      - name: Validate changed sources
        run: |
          npm ci --include=dev
          npm run lint
          npm run test:unit
      - name: Commit canonicalized sources
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'portal-tcc-maintenance[bot]'
          git config user.email 'portal-tcc-maintenance[bot]@users.noreply.github.com'
          git add server.ts src/pages/HomePage.tsx src/pages/ProcessoDetailPage.tsx server/integrations/googleDriveArchive.ts
          git commit -m 'fix: canonicaliza dados públicos e estrutura do Drive'
          git push origin HEAD:main
