name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Alinhar npm ao packageManager
        run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:ci
      - name: Validar importação do servidor em runtime de produção
        env:
          NODE_ENV: production
          VERCEL: '1'
        run: node --import tsx --input-type=module -e "await import('./server.ts'); console.log('Importação do servidor em modo produção aprovada.')"
      - run: npm run test:secure-flow
      - run: node scripts/test-institutional-template-contract.mjs
