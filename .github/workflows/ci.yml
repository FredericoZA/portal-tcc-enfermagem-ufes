name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Alinhar npm ao packageManager
        run: npm install --global npm@11.9.0
      - name: Instalar dependências
        run: npm ci
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Verificar ausência de segredos versionados
        run: npm run test:secrets
      - name: Validar TypeScript
        run: npm run lint
      - name: Validar paleta visual protegida
        run: npm run test:palette
      - name: Executar testes unitários
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit-test.log
      - name: Preservar diagnóstico dos testes unitários
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-diagnostics
          path: unit-test.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Executar contratos de provedores
        run: npm run test:contracts
      - name: Validar acessibilidade estática
        run: npm run test:a11y
      - name: Validar contrato de finalização
        run: npm run test:finalization
      - name: Gerar build de produção
        run: npm run build
      - name: Testar build HTTP
        run: npm run test:http
      - name: Validar importação do servidor em runtime de produção
        env:
          NODE_ENV: production
          VERCEL: '1'
        run: node --import tsx --input-type=module -e "await import('./server.ts'); console.log('Importação do servidor em modo produção aprovada.')"
      - name: Validar fluxo seguro
        run: npm run test:secure-flow
      - name: Validar contrato do modelo institucional
        run: node scripts/test-institutional-template-contract.mjs
