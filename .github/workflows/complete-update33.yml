name: Complete Update 33

on:
  push:
    branches:
      - update-33-restricted-area
    paths:
      - scripts/complete-update33.mjs

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update-33-restricted-area
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar fechamento da atualização 33
        run: node scripts/complete-update33.mjs
      - name: Commitar fechamento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi
          git commit -m "Atualização 33 — concluir área restrita e governança"
          git push origin HEAD:update-33-restricted-area
