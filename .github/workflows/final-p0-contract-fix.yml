name: Final P0 contract fix

on:
  push:
    branches: [main]
    paths:
      - scripts/final-p0-contract-fix.mjs
      - .github/workflows/final-p0-contract-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Aplicar fechamento P0
        run: node scripts/final-p0-contract-fix.mjs
      - name: Validar CI
        run: npm run test:ci
      - name: Validar fluxo seguro
        run: npm run test:secure-flow
      - name: Publicar correções
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Portal TCC automation"
          git config user.email "actions@users.noreply.github.com"
          git add server.ts server/publicViews.ts server/publicViews.test.ts
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional."
            exit 0
          fi
          git commit -m "fix: conclui contratos públicos e integridade do go-live"
          git push origin HEAD:main
