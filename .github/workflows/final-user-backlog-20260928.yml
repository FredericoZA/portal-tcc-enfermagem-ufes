name: Final backlog 1.0.48

on:
  push:
    branches:
      - fix/final-user-backlog-20260928

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migration when needed
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "1.0.48" ]; then
            node scripts/final-user-backlog-20260928.mjs
            node scripts/post-migrate-fixes-20260928.mjs
          else
            echo "Migration 1.0.48 already applied."
          fi
          node scripts/final-user-backlog-followup-20260928.mjs
      - name: Commit migrated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Apply final backlog 1.0.48 follow-up"
            git push
          fi
      - name: Validate
        run: |
          npm run test:ci
          npm run build
