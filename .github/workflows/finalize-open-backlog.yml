name: Finalize open backlog

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-open-backlog.mjs
      - .github/workflows/finalize-open-backlog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Aplicar correções pendentes
        run: node scripts/finalize-open-backlog.mjs
      - name: Validar CI local
        run: npm run test:ci
      - name: Validar fluxo seguro
        run: npm run test:secure-flow
      - name: Publicar correções no main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Portal TCC automation"
          git config user.email "actions@users.noreply.github.com"
          git add server.ts server src .github/workflows/production-smoke.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional."
            exit 0
          fi
          git commit -m "fix: conclui pendências críticas de fluxo e go-live"
          git push origin HEAD:main
