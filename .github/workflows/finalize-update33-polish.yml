name: Finalize Update 33 Polish

on:
  push:
    branches:
      - update-33-restricted-area
    paths:
      - scripts/finalize-update33-polish.mjs

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update-33-restricted-area
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar polimento final da atualização 33
        run: node scripts/finalize-update33-polish.mjs
      - name: Commitar polimento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi
          git commit -m "Atualização 33 — concluir identidade pública e contatos"
          git push origin HEAD:update-33-restricted-area
