name: Finalize UX and signature

on:
  push:
    branches: [fix/ux-standard-gov-signature]
    paths:
      - scripts/finalize-ux-signature.mjs
      - .github/workflows/finalize-ux-signature.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ux-standard-gov-signature
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Alinhar npm
        run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Aplicar fechamento
        run: node scripts/finalize-ux-signature.mjs
      - name: Validar CI
        run: npm run test:ci
      - name: Validar fluxo seguro
        run: npm run test:secure-flow
      - name: Validar contrato institucional
        run: node scripts/test-institutional-template-contract.mjs
      - name: Commitar resultado validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Portal TCC automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: finaliza UX, recuperação e assinatura Gov.br"
          git push origin HEAD:fix/ux-standard-gov-signature
