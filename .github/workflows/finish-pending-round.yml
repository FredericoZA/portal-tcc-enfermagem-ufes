name: Finish pending round

on:
  push:
    branches:
      - fix/fechamento-pendencias-20260913

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fechamento-pendencias-20260913
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Alinhar npm
        run: npm install --global npm@11.9.0
      - name: Aplicar ajustes pendentes
        run: node scripts/finish-pending-round.mjs
      - name: Instalar dependências
        run: npm ci
      - name: Validar código e fluxo seguro
        run: |
          npm run test:ci
          npm run test:secure-flow
      - name: Gravar alterações validadas
        run: |
          git config user.name "Portal TCC automation"
          git config user.email "actions@users.noreply.github.com"
          git add server.ts src scripts
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para gravar."
          else
            git commit -m "fix: fecha pendências de configuração e interface"
            git push origin HEAD:fix/fechamento-pendencias-20260913
          fi
