name: Fix Update 33 Final

on:
  push:
    branches:
      - update-33-restricted-area
    paths:
      - scripts/fix-update33-final.mjs

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update-33-restricted-area
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar correção final
        run: node scripts/fix-update33-final.mjs
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi
          git commit -m "Atualização 33 — remover último legado de ouvinte"
          git push origin HEAD:update-33-restricted-area
