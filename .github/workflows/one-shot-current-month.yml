name: One-shot current month fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-current-month.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Patch calendar current month
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/HomePage.tsx')
          text = path.read_text()
          replacements = {
            "const [currentCalendarDate, setCurrentCalendarDate] = useState<Date>(new Date(2026, 6, 1)); // Default July 2026": "const [currentCalendarDate, setCurrentCalendarDate] = useState<Date>(() => { const now = new Date(); return new Date(now.getFullYear(), now.getMonth(), 1); }); // Always open on the user's current month",
            "const today = new Date(2026, 6, 1);\n    setCurrentCalendarDate(today);\n    setSelectedFilterYear(2026);\n    setSelectedFilterMonth(6);": "const now = new Date();\n    const today = new Date(now.getFullYear(), now.getMonth(), 1);\n    setCurrentCalendarDate(today);\n    setSelectedFilterYear(today.getFullYear());\n    setSelectedFilterMonth(today.getMonth());",
            "title=\"Ir para Hoje (Jul/2026)\"": "title=\"Ir para o mês atual\""
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source not found: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Validate
        run: npm run test:ci
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-current-month.yml
          git config user.name "portal-tcc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/HomePage.tsx .github/workflows/one-shot-current-month.yml
          git commit -m "fix(calendar): abre calendário no mês atual"
          git push
