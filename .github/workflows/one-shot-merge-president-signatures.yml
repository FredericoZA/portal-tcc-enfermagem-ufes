name: One-shot merge President signatures
on:
  push:
    paths:
      - '.github/workflows/one-shot-merge-president-signatures.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Correct patch boundary
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/scripts/merge-president-signatures.py')
          text = path.read_text(encoding='utf-8')
          old = "page = page[:block_start] + new_filters + page[block_end:]"
          new = "page = page[:block_start] + new_filters + page[block_end + len('              </div>\\n'):]"
          if old not in text:
              raise SystemExit('Patch boundary anchor not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Apply President/Asten integration patch
        run: python .github/scripts/merge-president-signatures.py
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Validate application
        run: npm run test:ci
      - name: Validate secure flow
        run: npm run test:secure-flow
      - name: Validate institutional contract
        run: node scripts/test-institutional-template-contract.mjs
      - name: Commit integrated President area
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-merge-president-signatures.yml
          rm -f .github/scripts/merge-president-signatures.py
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(president): integra assinaturas Asten e padroniza identidade visual"
          git push
