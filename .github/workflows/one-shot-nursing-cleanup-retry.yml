name: One-shot nursing cleanup retry
on:
  push:
    paths:
      - '.github/workflows/one-shot-nursing-cleanup-retry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Reuse canonicalization patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/one-shot-nursing-cleanup.yml').read_text(encoding='utf-8')
          start=source.index('      - name: Canonicalize Nursing portal')
          block=source[start:]
          marker='        run: |\n'
          body=block.split(marker,1)[1].split('\n      - name: Install dependencies',1)[0]
          script=textwrap.dedent(body)
          exec(compile(script,'canonicalize-nursing','exec'),{})
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Validate application
        run: npm run test:ci
      - name: Validate secure flow
        run: npm run test:secure-flow
      - name: Validate institutional contract
        run: node scripts/test-institutional-template-contract.mjs
      - name: Commit canonical Nursing portal
        run: |
          rm -f .github/workflows/one-shot-nursing-cleanup.yml .github/workflows/one-shot-nursing-cleanup-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: fixa Portal para Enfermagem e consolida análise'
          git push
