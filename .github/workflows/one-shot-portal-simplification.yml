name: One-shot portal simplification
on:
  push:
    paths:
      - '.github/workflows/one-shot-portal-simplification.yml'
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Simplify Portal UI and evaluation
        shell: python
        run: |
          from pathlib import Path
          import re

          def load(path): return Path(path).read_text(encoding='utf-8')
          def save(path, text): Path(path).write_text(text, encoding='utf-8')
          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'anchor missing: {label}')
              return text.replace(old, new, 1)

          # AVALIAÇÃO: resultado + parecer, sem nota numérica em API, documentos ou variáveis.
          p=load('src/services/apiClient.ts')
          p=p.replace("submitEvaluation: (id: string, data: { resultadoCode: string; parecer: string; notaFinal: number; answers?: Record<string, string | number | boolean>; dataConfirmed: true; expectedDataRevision: number; expectedSchemaRevision: number })", "submitEvaluation: (id: string, data: { resultadoCode: string; parecer: string; answers?: Record<string, string | number | boolean>; dataConfirmed: true; expectedDataRevision: number; expectedSchemaRevision: number })")
          save('src/services/apiClient.ts',p)

          p=load('server/workflow/runtime.ts')
          p=p.replace("    NOTA_FINAL: process.avaliacao.notaFinal === undefined ? '' : String(process.avaliacao.notaFinal),\n    NOTA: process.avaliacao.notaFinal === undefined ? '' : String(process.avaliacao.notaFinal),\n    AVALIACAO_NOTA: process.avaliacao.notaFinal === undefined ? '' : String(process.avaliacao.notaFinal),", "    // Compatibilidade com modelos históricos: esta instalação não registra nota numérica.\n    NOTA_FINAL: '',\n    NOTA: '',\n    AVALIACAO_NOTA: '',")
          p=p.replace("    CAMPO_10: process.avaliacao.notaFinal === undefined ? '' : String(process.avaliacao.notaFinal),", "    CAMPO_10: '',")
          save('server/workflow/runtime.ts',p)

          p=load('server.ts')
          p=p.replace("const result=p.avaliacao?.resultadoLabel||p.avaliacao?.resultadoCode||'';const grade=p.avaliacao?.notaFinal??p.avaliacao?.nota;const replacements:Record<string,string>={", "const result=p.avaliacao?.resultadoLabel||p.avaliacao?.resultadoCode||'';const replacements:Record<string,string>={")
          p=p.replace("CAMPO_09:result,CAMPO_10:grade===undefined?'':String(grade),CAMPO_11:", "CAMPO_09:result,CAMPO_10:'',CAMPO_11:")
          p=p.replace("AVALIACAO_RESULTADO:result,AVALIACAO_NOTA:grade===undefined?'':String(grade),AVALIACAO_PARECER:", "AVALIACAO_RESULTADO:result,AVALIACAO_NOTA:'',AVALIACAO_PARECER:")
          p=re.sub(r"\n\s*`Nota: \$\{process\.avaliacao\.notaFinal \?\? process\.avaliacao\.nota \?\? ''\}`,",'',p)
          save('server.ts',p)

          p=load('server/workflow/modelPreview.ts')
          p=re.sub(r",notaFinal:Number\(supplied\.NOTA_FINAL\|\|supplied\.CAMPO_10\|\|8\)",'',p)
          save('server/workflow/modelPreview.ts',p)

          p=load('src/utils/courseStudioValidator.ts')
          p=p.replace("'DEFESA_DATA_HORA', 'DEFESA_LOCAL', 'RESULTADO', 'PARECER', 'NOTA_FINAL', 'NOTA', 'AVALIACAO_NOTA',", "'DEFESA_DATA_HORA', 'DEFESA_LOCAL', 'RESULTADO', 'PARECER',")
          p=p.replace("'CAMPO_07_LOCAL', 'CAMPO_09', 'CAMPO_10', 'CAMPO_11', 'CAMPO_12', 'CAMPO_13'", "'CAMPO_07_LOCAL', 'CAMPO_09', 'CAMPO_11', 'CAMPO_12', 'CAMPO_13'")
          save('src/utils/courseStudioValidator.ts',p)

          p=load('src/services/demoSeed.ts')
          p=re.sub(r"evaluationOutcomeOptions: \[\s*\{ code: 'APROVADO'.*?\],", "evaluationOutcomeOptions: [\n    { code: 'APROVADO', label: 'Aprovado' },\n    { code: 'APROVADO_COM_RESSALVA', label: 'Aprovado com ressalva' },\n    { code: 'REPROVADO', label: 'Reprovado' },\n  ],", p, count=1, flags=re.S)
          p=re.sub(r"\n\s*notaFinal:\s*\d+(?:\.\d+)?,",'',p)
          p=p.replace("resultadoLabel: 'Aprovado (x ≥ 7,00)'", "resultadoLabel: 'Aprovado'")
          p=p.replace('A banca examinadora aprova o trabalho com nota final 9,50.', 'A banca examinadora aprova o trabalho, conforme parecer registrado.')
          save('src/services/demoSeed.ts',p)

          p=load('src/types/index.ts')
          if '/** @deprecated legado somente para leitura' not in p:
              p=p.replace("  nota?: number;\n  notaFinal?: number;", "  /** @deprecated legado somente para leitura de registros antigos; novas avaliações não possuem nota numérica. */\n  nota?: number;\n  /** @deprecated legado somente para leitura de registros antigos; novas avaliações não possuem nota numérica. */\n  notaFinal?: number;")
          save('src/types/index.ts',p)

          # CONFIGURAÇÕES: remove a sub-aba inteira Operação, continuidade e conformidade.
          p=load('src/pages/ConfiguracoesPage.tsx')
          p=p.replace("import { CourseOperationsPanel } from '../components/CourseOperationsPanel';\n",'')
          p=re.sub(r"\n\s*course_operations: false,",'',p)
          p=re.sub(r"\n\s*course_operations: true,",'',p)
          p=re.sub(r"\n\s*\{isMasterAdmin && \(\s*<section id=\"section-operacao-curso\".*?</section>\s*\)\}\s*\n",'\n',p,count=1,flags=re.S)
          p=re.sub(r"\n\s*\{ id: 'CAMPO_10', name: 'AVALIACAO_NOTA', label: 'Nota final', dataType: 'number' \},",'',p)
          p=re.sub(r"\n\s*'-CAMPO_10-': '10,0 \(Dez\)',",'',p)
          save('src/pages/ConfiguracoesPage.tsx',p)

          # AGENDA: o download ICS fica na própria agenda.
          p=load('src/pages/AgendaPage.tsx')
          p=p.replace("import { Clock, MapPin } from 'lucide-react';", "import { Clock, Download, MapPin } from 'lucide-react';")
          anchor='''        <p className="text-[10px] sm:text-[11px] font-medium leading-normal mt-0.5 opacity-90">\n          Apresentações públicas registradas pela comissão de TCC. Consulte data, horário e local de cada defesa.\n        </p>'''
          replacement=anchor+'''\n        <div className="pt-2">\n          <a href="/api/public/calendar.ics" className="inline-flex items-center gap-2 rounded-xl border border-current/20 bg-white/10 px-3 py-2 text-[10px] font-black uppercase tracking-wide hover:bg-white/20" title="Baixar agenda para Google Calendar, Outlook ou Apple Calendar">\n            <Download className="h-3.5 w-3.5" /> Baixar agenda (.ics)\n          </a>\n        </div>'''
          p=must_replace(p,anchor,replacement,'agenda ICS')
          save('src/pages/AgendaPage.tsx',p)

          # ANÁLISE: substitui Indicadores no menu e carrega o módulo junto do shell para evitar falha do chunk lazy observado em produção.
          p=load('src/App.tsx')
          p=p.replace("import { EmergencyRecoveryModal } from './components/EmergencyRecoveryModal';\n", "import { EmergencyRecoveryModal } from './components/EmergencyRecoveryModal';\nimport { IndicadoresPage } from './pages/IndicadoresPage';\n")
          p=p.replace("const IndicadoresPage = lazy(() => import('./pages/IndicadoresPage').then((module) => ({ default: module.IndicadoresPage })));\n",'')
          p=p.replace("const PortalReplicationPage = lazy(() => import('./pages/PortalReplicationPage').then((module) => ({ default: module.PortalReplicationPage })));\n",'')
          p=p.replace("      case 'replicar':\n        return <PortalReplicationPage />;\n",'')
          p=p.replace("      case 'indicadores':\n        return <IndicadoresPage />;", "      case 'analise':\n      case 'indicadores':\n        return <IndicadoresPage />;")
          p=p.replace("                  : currentTab === 'replicar' ? 'Como replicar o Portal'\n",'')
          p=p.replace("                  : currentTab === 'indicadores' ? 'Indicadores do Portal'", "                  : (currentTab === 'analise' || currentTab === 'indicadores') ? 'Análise'")
          save('src/App.tsx',p)

          p=load('src/components/Sidebar.tsx')
          p=p.replace('  GraduationCap,\n','')
          p=re.sub(r"\n\s*replicar: \{ id: 'replicar'.*?\},",'',p,count=1)
          p=p.replace("              indicadores: { id: 'indicadores', label: getNavLabel('indicadores', 'Indicadores'), icon: BarChart3, emoji: '📊', visible: isMasterAdmin && !isVisitor }", "              analise: { id: 'analise', label: getNavLabel('analise', 'Análise'), icon: BarChart3, emoji: '📊', visible: isMasterAdmin && !isVisitor }")
          p=p.replace("              ? layoutConfig.sidebarNavOrder.filter((key) => key !== 'acessar-portal')\n              : ['home', 'biblioteca', 'DIVIDER_1', 'meus-processos', 'coordenador', 'configuracoes', 'indicadores', 'DIVIDER_2', 'tutorial', 'replicar'];", "              ? layoutConfig.sidebarNavOrder.filter((key) => !['acessar-portal', 'replicar'].includes(key)).map((key) => key === 'indicadores' ? 'analise' : key)\n              : ['home', 'biblioteca', 'DIVIDER_1', 'meus-processos', 'coordenador', 'configuracoes', 'analise', 'DIVIDER_2', 'tutorial'];")
          p=p.replace("            if (!order.includes('indicadores')) {\n              const settingsIndex = order.indexOf('configuracoes');\n              order.splice(settingsIndex >= 0 ? settingsIndex + 1 : order.length, 0, 'indicadores');\n            }\n            if (!order.includes('replicar')) order.push('replicar');", "            if (!order.includes('analise')) {\n              const settingsIndex = order.indexOf('configuracoes');\n              order.splice(settingsIndex >= 0 ? settingsIndex + 1 : order.length, 0, 'analise');\n            }")
          save('src/components/Sidebar.tsx',p)

          p=load('src/pages/IndicadoresPage.tsx')
          p=p.replace('Estatísticas do Portal','Análise do Portal')
          p=p.replace('<h1 className="mt-2 text-2xl font-black tracking-tight sm:text-3xl">Indicadores</h1>', '<h1 className="mt-2 text-2xl font-black tracking-tight sm:text-3xl">Análise</h1>')
          p=p.replace('Visão administrativa agregada do uso do Portal TCC. Esta página não exibe nomes, e-mails, matrículas ou títulos dos trabalhos.', 'Indicadores, estatísticas e qualidade operacional do Portal TCC reunidos em um único local. Esta área não exibe nomes, e-mails, matrículas ou títulos dos trabalhos.')
          save('src/pages/IndicadoresPage.tsx',p)

          # INSTALAÇÃO FIXA: remove campos administrativos que davam a impressão de portal multicurso e editor paralelo de cores.
          p=load('src/services/integrationStudioService.ts')
          p=p.replace("  institutionName: 'Instituição não configurada',\n  courseName: 'Curso não configurado',", "  institutionName: 'Universidade Federal do Espírito Santo',\n  courseName: 'Curso de Graduação em Enfermagem e Obstetrícia',")
          p=p.replace("  secondaryColor: '#17324d',\n  accentColor: '#d4a017',", "  secondaryColor: '#005830',\n  accentColor: '#005830',")
          p=p.replace("  documentHeaderText: 'INSTITUIÇÃO\\nCURSO',\n  documentFooterText: 'Unidade acadêmica • Campus • Cidade/UF',\n  emailFooterText: 'Comissão de TCC • Curso • Instituição'", "  documentHeaderText: 'UNIVERSIDADE FEDERAL DO ESPÍRITO SANTO\\nCURSO DE GRADUAÇÃO EM ENFERMAGEM E OBSTETRÍCIA',\n  documentFooterText: 'Departamento de Enfermagem • Centro de Ciências da Saúde • Vitória/ES',\n  emailFooterText: 'Colegiado do Curso de Graduação em Enfermagem e Obstetrícia • UFES'")
          save('src/services/integrationStudioService.ts',p)

          p=load('src/components/IntegrationStudioPanel.tsx')
          p=p.replace("                <div><label className={labelClass}>Nome da instituição</label><input value={brandKit.institutionName} onChange={(e) => updateBrand('institutionName', e.target.value)} className={inputClass} /></div>\n                <div><label className={labelClass}>Nome do colegiado/curso</label><input value={brandKit.courseName} onChange={(e) => updateBrand('courseName', e.target.value)} className={inputClass} /></div>", "                <div className=\"sm:col-span-2 rounded-xl border border-emerald-100 bg-emerald-50 p-3 text-xs text-emerald-950\"><strong>Identidade fixa:</strong> Universidade Federal do Espírito Santo · Curso de Graduação em Enfermagem e Obstetrícia. Esta instalação atende exclusivamente à Enfermagem/UFES.</div>")
          p=re.sub(r"\n\s*<div className=\"grid grid-cols-2 gap-3 sm:grid-cols-4\">\s*\{\(\[\['primaryColor'.*?</div>\n", "\n              <div className=\"rounded-xl border border-slate-200 bg-slate-50 p-3 text-xs text-slate-700\"><strong>Cores do site:</strong> use a Personalização do Portal. Este editor não mantém uma paleta paralela.</div>\n", p, count=1, flags=re.S)
          p=re.sub(r"\n\s*<section className=\{`\$\{panelClass\} p-4`\} aria-labelledby=\"replication-guide-title\">.*?</section>\n",'\n',p,count=1,flags=re.S)
          save('src/components/IntegrationStudioPanel.tsx',p)

          # Remove artefatos de interface explicitamente descartados; o histórico Git preserva recuperação.
          for obsolete in ['src/components/CourseOperationsPanel.tsx','src/pages/PortalReplicationPage.tsx','docs/CONFIGURACAO_POR_CURSO.md']:
              path=Path(obsolete)
              if path.exists(): path.unlink()

          # TESTES da política sem nota.
          evaluation_test='''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { DEMO_PROCESSES, INITIAL_SETTINGS } from '../src/services/demoSeed';\nimport { acceptEvaluation, EvaluationError } from './workflow/evaluation';\nimport { evaluationQuestions } from '../src/utils/evaluationForm';\nimport { buildProcessVariables } from './workflow/runtime';\nimport { normalizeUnifiedAppearance } from '../src/utils/unifiedAppearance';\nimport { portalFontFamily } from '../src/utils/portalFonts';\n\nconst process = structuredClone(DEMO_PROCESSES[0]);\nconst settings = structuredClone(INITIAL_SETTINGS);\nconst now = new Date('2026-09-09T16:00:00Z');\nconst valid = { resultadoCode: 'APROVADO', parecer: 'Parecer registrado pelo orientador.', dataConfirmed: true,\n  expectedDataRevision: process.dataRevision, expectedSchemaRevision: settings.integrationStudio?.revision || 0 };\nconst accept = (patch: Record<string, unknown> = {}) => acceptEvaluation(process, { ...valid, ...patch }, settings, process.orientador.email, now);\n\ntest('avaliação aceita resultado e parecer sem nota numérica e preserva a conferência', () => {\n  const result = accept({ notaFinal: '9,25', answers: { NOTA_FINAL: 9.25 } });\n  assert.equal(result.resultadoLabel, 'Aprovado');\n  assert.equal((result as any).notaFinal, undefined);\n  assert.equal(result.answers.NOTA_FINAL, undefined);\n  assert.equal(result.dataReview.confirmedBy, process.orientador.email);\n  assert.equal(result.dataReview.sourceDataRevision, process.dataRevision);\n  assert.ok(result.dataReview.fields.some(([, value]) => value.includes(process.aluno1.matricula)));\n});\n\ntest('avaliação recusa ausência de conferência, resultado inválido e parecer incorreto', () => {\n  for (const patch of [{ dataConfirmed: false }, { parecer: '' }, { parecer: 123 }, { resultadoCode: 'INVENTADO' }]) assert.throws(() => accept(patch), EvaluationError, JSON.stringify(patch));\n});\n\ntest('avaliação recusa revisões desatualizadas e apresentação ainda não iniciada', () => {\n  assert.throws(() => accept({ expectedDataRevision: process.dataRevision - 1 }), (e: EvaluationError) => e.code === 'STALE_DATA_REVIEW');\n  assert.throws(() => accept({ expectedSchemaRevision: 999 }), (e: EvaluationError) => e.code === 'STALE_EVALUATION_FORM');\n  assert.throws(() => acceptEvaluation(process, valid, settings, process.orientador.email, new Date('2026-01-01')), (e: EvaluationError) => e.code === 'DEFENSE_NOT_STARTED');\n});\n\ntest('configuração antiga não consegue reintroduzir nota na avaliação', () => {\n  const fields = evaluationQuestions({ formTemplates: [{ id: 'form-parecer-banca', questions: [\n    { fieldKey: 'NOTA', label: 'Minha nota', fieldType: 'number', required: true },\n    { fieldKey: 'CAMPO_10', label: 'Nota antiga', fieldType: 'number', required: true },\n  ] }] as any });\n  assert.equal(fields.some(q => ['NOTA', 'NOTA_FINAL', 'CAMPO_10', 'AVALIACAO_NOTA'].includes(q.fieldKey)), false);\n  assert.deepEqual(fields.map(q => q.fieldKey), ['RESULTADO', 'PARECER']);\n});\n\ntest('variáveis legadas de nota ficam vazias e identidade canônica não é sobrescrita', () => {\n  const p = { ...process, avaliacao: { ...process.avaliacao, ...accept(), answers: { NOTA_FINAL: 2, ORIENTADOR_EMAIL: 'intruso@example.invalid' } } };\n  const vars = buildProcessVariables({ process: p, actorEmail: process.orientador.email, actorRoles: ['ADVISOR'], eventCode: 'EVALUATION_SUBMITTED' });\n  assert.equal(vars.NOTA_FINAL, ''); assert.equal(vars.CAMPO_10, ''); assert.equal(vars.AVALIACAO_NOTA, '');\n  assert.equal(vars.ORIENTADOR_EMAIL, process.orientador.email);\n});\n\ntest('aparência publicada elimina exceções antigas e mantém estrutura de colunas e conteúdo', () => {\n  const input = { ...settings, tableLayouts: { defenses: { inheritGlobalAppearance: false, textFormat: { fontSize: 'xs' }, columnOrder: ['titulo'], customLabels: { titulo: 'Trabalho' } } },\n    portalAppearance: { schemaVersion: 3, linkedItems: { sheet_calendar: false, popup_login: false }, generalPopups: { uploadAtaHeaderBg: '#005830' }, loginPopup: { title: 'Meu portal', primaryBtnBg: '#ff0000' } } };\n  const result = normalizeUnifiedAppearance(input);\n  assert.equal(result.tableLayouts!.defenses.textFormat, undefined);\n  assert.deepEqual(result.tableLayouts!.defenses.columnOrder, ['titulo']);\n  assert.equal(result.portalAppearance!.linkedItems!.popup_login, true);\n  assert.equal(result.portalAppearance!.loginPopup!.title, 'Meu portal');\n  assert.equal(result.portalAppearance!.loginPopup!.primaryBtnBg, result.portalAppearance!.globalPopupStyle!.actionBgColor);\n  assert.deepEqual(normalizeUnifiedAppearance(result), result);\n});\n\ntest('a fonte e as cores publicadas são iguais nas tabelas e nos pop-ups', () => {\n  for (const font of ['georgia', 'Roboto, sans-serif', 'Nunito, sans-serif', 'mono']) {\n    const result = normalizeUnifiedAppearance({ ...settings, tableAppearance: { fontFamily: 'inter', customHeaderColor: '#ff0000' }, portalAppearance: { schemaVersion: 4, globalPopupStyle: { fontFamily: font, headerBgColor: '#005830' } as any } });\n    assert.equal(portalFontFamily(result.tableAppearance?.fontFamily), result.portalAppearance?.globalPopupStyle?.fontFamily);\n    assert.equal(result.tableAppearance?.customHeaderColor, '#005830');\n    assert.deepEqual(normalizeUnifiedAppearance(result), result);\n  }\n});\n'''
          save('server/evaluation.test.ts',evaluation_test)

          p=load('server/evaluationHttp.test.ts')
          p=p.replace('HTTP: orientador confere e lança nota; aluno é recusado; estado e aparência ficam gravados','HTTP: orientador confere e registra avaliação; aluno é recusado; estado e aparência ficam gravados')
          p=p.replace(", notaFinal: '8,75'",'')
          p=p.replace("    assert.equal((await request(route, p.orientador.email, { ...body, notaFinal: '' })).body.code, 'INVALID_EVALUATION');\n",'')
          p=p.replace("    assert.equal(saved.body.avaliacao.notaFinal, 8.75);\n","    assert.equal(saved.body.avaliacao.notaFinal, undefined);\n")
          p=p.replace("    assert.equal(disk.processes[0].avaliacao.notaFinal, 8.75);","    assert.equal(disk.processes[0].avaliacao.notaFinal, undefined);")
          save('server/evaluationHttp.test.ts',p)

          # Sanidade das decisões de interface.
          assert 'section-operacao-curso' not in load('src/pages/ConfiguracoesPage.tsx')
          assert 'CourseOperationsPanel' not in load('src/pages/ConfiguracoesPage.tsx')
          assert "id: 'replicar'" not in load('src/components/Sidebar.tsx')
          assert "id: 'analise'" in load('src/components/Sidebar.tsx')
          assert 'Nota final' not in load('src/components/AdvisorEvaluationPanel.tsx')
          print('simplification patch applied')
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Validate application
        run: npm run test:ci
      - name: Validate secure flow
        run: npm run test:secure-flow
      - name: Validate institutional template contract
        run: node scripts/test-institutional-template-contract.mjs
      - name: Browser boot smoke
        run: |
          python3 -m http.server 4173 --directory dist/client >/tmp/portal-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:4173/ >/tmp/portal-dom.html 2>/tmp/portal-browser.log
            grep -q 'portal-sidebar' /tmp/portal-dom.html
          else
            echo 'Headless browser unavailable; compile/build checks remain authoritative.'
          fi
      - name: Commit validated simplification
        run: |
          rm -f .github/workflows/one-shot-portal-simplification.yml .github/workflows/one-shot-nursing-cleanup.yml .github/workflows/one-shot-nursing-cleanup-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: simplifica configurações e corrige área de análise'
          git push
