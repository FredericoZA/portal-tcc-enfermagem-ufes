name: One-shot public DTO fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-public-dto-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Remove internal creator field from anonymous DTO
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server.ts')
          text = path.read_text()
          old_sig = 'function publicProcessView(p:ProcessData):ProcessData{'
          new_sig = 'function publicProcessView(p:ProcessData):any{'
          old_row = "id:p.id,protocolo:p.protocolo,titulo:p.titulo,etapaAtual:p.etapaAtual,status:p.status,createdByEmail:'',"
          new_row = "id:p.id,protocolo:p.protocolo,titulo:p.titulo,etapaAtual:p.etapaAtual,status:p.status,"
          if old_sig not in text:
              raise SystemExit('publicProcessView signature not found')
          if old_row not in text:
              raise SystemExit('createdByEmail row not found')
          text = text.replace(old_sig, new_sig, 1).replace(old_row, new_row, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Validate full CI suite
        run: npm run test:ci
      - name: Validate secure flow
        run: npm run test:secure-flow
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-public-dto-fix.yml
          git config user.name "portal-tcc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.ts .github/workflows/one-shot-public-dto-fix.yml
          git commit -m "security(public): remove metadado interno do DTO anônimo"
          git push
