name: One-shot remove generic governance
on:
  push:
    paths:
      - '.github/workflows/one-shot-remove-governance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply canonical UFES cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          config_path = Path('src/pages/ConfiguracoesPage.tsx')
          text = config_path.read_text(encoding='utf-8')
          text = text.replace("import { PortalGovernancePanel } from '../components/PortalGovernancePanel';\n", '')
          text = re.sub(r"\n\s*governance:\s*(?:false|true),", '', text)
          marker = '<section id="section-governanca-instalacao"'
          marker_index = text.find(marker)
          if marker_index >= 0:
              start = text.rfind('{isMasterAdmin && (', 0, marker_index)
              close_marker = '</section>\n      )}'
              end = text.find(close_marker, marker_index)
              if start < 0 or end < 0:
                  raise SystemExit('Bloco de governança encontrado, mas não foi possível delimitá-lo com segurança.')
              text = text[:start] + text[end + len(close_marker):]
          config_path.write_text(text, encoding='utf-8')

          governance = Path('src/components/PortalGovernancePanel.tsx')
          if governance.exists():
              governance.unlink()

          server_path = Path('server.ts')
          server = server_path.read_text(encoding='utf-8')
          server = server.replace("app.get('/api/admin/metrics/definitions',requireAuthenticated,requireAdministrator,requireFeature('OPERATIONS_KPIS'),", "app.get('/api/admin/metrics/definitions',requireAuthenticated,requireAdministrator,")
          server = server.replace("app.get('/api/admin/metrics',requireAuthenticated,requireAdministrator,requireFeature('OPERATIONS_KPIS'),", "app.get('/api/admin/metrics',requireAuthenticated,requireAdministrator,")
          server_path.write_text(server, encoding='utf-8')

          indicators_path = Path('src/pages/IndicadoresPage.tsx')
          indicators = indicators_path.read_text(encoding='utf-8')
          old = "() => Object.entries(metrics?.processes.byStatus || {}).sort((a, b) => b[1] - a[1]),"
          new = "() => (Object.entries(metrics?.processes.byStatus || {}) as Array<[string, number]>).sort((a, b) => b[1] - a[1]),"
          if old in indicators:
              indicators = indicators.replace(old, new)
          indicators_path.write_text(indicators, encoding='utf-8')

          google_path = Path('server/integrations/googleWorkspace.ts')
          google = google_path.read_text(encoding='utf-8')
          anchor = "function sanitizeHeader(value: string): string { return value.replace(/[\\r\\n]+/g, ' ').trim(); }"
          helper = """function sanitizeHeader(value: string): string { return value.replace(/[\\r\\n]+/g, ' ').trim(); }\nfunction encodeMimeHeader(value: string): string {\n  const safe = sanitizeHeader(value);\n  return /^[\\x20-\\x7E]*$/.test(safe) ? safe : `=?UTF-8?B?${Buffer.from(safe, 'utf8').toString('base64')}?=`;\n}"""
          if 'function encodeMimeHeader' not in google:
              if anchor not in google:
                  raise SystemExit('Função sanitizeHeader não encontrada.')
              google = google.replace(anchor, helper)
          google = google.replace('`Subject: ${sanitizeHeader(input.subject)}`', '`Subject: ${encodeMimeHeader(input.subject)}`')
          google_path.write_text(google, encoding='utf-8')

          login_path = Path('src/utils/loginPopupConfig.ts')
          login = login_path.read_text(encoding='utf-8')
          replacements = {
              "subtitle: 'Curso • Instituição',": "subtitle: 'Enfermagem e Obstetrícia • UFES',",
              "description: 'Informe o seu e-mail institucional ou cadastrado. Enviaremos um código de seis dígitos para sua caixa de entrada. Os TCCs em que você participa aparecerão automaticamente.',": "description: 'Informe o e-mail cadastrado para receber um código de acesso de seis dígitos. Após a validação, os TCCs vinculados ao seu e-mail aparecerão automaticamente.',",
              "discenteTip: 'utilize o e-mail previamente autorizado pela administração.',": "discenteTip: 'utilize sempre seu e-mail institucional @edu.ufes.br cadastrado no processo.',",
              "emailLabel: 'E-mail Institucional ou Cadastrado',": "emailLabel: 'E-mail cadastrado',",
              "emailPlaceholder: 'nome@instituicao.br',": "emailPlaceholder: 'nome@edu.ufes.br',",
          }
          for old_text, new_text in replacements.items():
              login = login.replace(old_text, new_text)
          old_local = """const local = raw\n      ? { ...DEFAULT_LOGIN_POPUP_CONFIG, ...JSON.parse(raw) }\n      : { ...DEFAULT_LOGIN_POPUP_CONFIG };"""
          new_local = """const local = raw\n      ? {\n          ...DEFAULT_LOGIN_POPUP_CONFIG,\n          ...JSON.parse(raw),\n          title: DEFAULT_LOGIN_POPUP_CONFIG.title,\n          subtitle: DEFAULT_LOGIN_POPUP_CONFIG.subtitle,\n          description: DEFAULT_LOGIN_POPUP_CONFIG.description,\n          discenteTip: DEFAULT_LOGIN_POPUP_CONFIG.discenteTip,\n          docenteTip: DEFAULT_LOGIN_POPUP_CONFIG.docenteTip,\n          emailLabel: DEFAULT_LOGIN_POPUP_CONFIG.emailLabel,\n          emailPlaceholder: DEFAULT_LOGIN_POPUP_CONFIG.emailPlaceholder,\n          buttonText: DEFAULT_LOGIN_POPUP_CONFIG.buttonText,\n          securityText: DEFAULT_LOGIN_POPUP_CONFIG.securityText,\n          locationText: DEFAULT_LOGIN_POPUP_CONFIG.locationText\n        }\n      : { ...DEFAULT_LOGIN_POPUP_CONFIG };"""
          login = login.replace(old_local, new_local)
          login_path.write_text(login, encoding='utf-8')

          home_path = Path('src/pages/HomePage.tsx')
          home = home_path.read_text(encoding='utf-8')
          home = home.replace('className={`${currentTheme.headerBg} border-b px-5 py-4 flex items-center justify-between`}', 'className={`${currentTheme.headerBg} border-b px-5 py-3.5 flex items-center justify-between`}')
          home = home.replace('className="w-10 h-10 rounded-xl bg-white border border-slate-200/80 flex items-center justify-center shadow-2xs shrink-0"', 'className="w-12 h-12 flex items-center justify-center shrink-0"')
          home = home.replace('<NursingEmblemLogo size={28}', '<NursingEmblemLogo size={44}')
          home = home.replace('className="font-bold text-sm leading-tight" style={{ color: loginPopupConfig.cardTextColor || \'#0f172a\' }}', 'className="font-black text-lg sm:text-xl leading-tight" style={{ color: loginPopupConfig.cardTextColor || \'#0f172a\' }}')
          home = home.replace('className={`text-[11px] ${currentTheme.accentText} font-medium`}', 'className={`mt-0.5 text-xs ${currentTheme.accentText} font-semibold`}')
          home_path.write_text(home, encoding='utf-8')

      - name: Install dependencies
        run: npm ci --include=dev
      - name: Validate
        run: npm run test:ci
      - name: Secure flow
        run: npm run test:secure-flow
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-remove-governance.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(config): simplify UFES admin and fix access UX"
          git push
