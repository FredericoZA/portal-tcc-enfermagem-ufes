name: One-shot sanitize public Home

on:
  push:
    branches:
      - fix/public-home-matricula-cleanup-20260913
    paths:
      - scripts/one-shot-sanitize-public-home.mjs
      - .github/workflows/one-shot-sanitize-public-home.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Sanitizar Home pública
        run: node scripts/one-shot-sanitize-public-home.mjs
      - name: Validar testes
        run: npm run test:ci
      - name: Commitar correção somente na branch isolada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Portal TCC maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/HomePage.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "fix: remove matrícula da Home pública"
          git push origin HEAD:fix/public-home-matricula-cleanup-20260913
