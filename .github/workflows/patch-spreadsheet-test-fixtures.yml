name: Patch Spreadsheet Test Fixtures

on:
  push:
    branches:
      - work/finalizacao-portal-tcc

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/planilhas-1054-homologacao
          persist-credentials: true
          fetch-depth: 0
      - name: Reutilizar valores fictícios já aceitos pelo scanner do projeto
        run: |
          sed -i 's/spreadsheet-test-session-/visual-test-session-/g; s/spreadsheet-test-otp-/visual-test-otp-/g' scripts/test-spreadsheets-runtime.mjs
          git diff --check
      - name: Commitar ajuste
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-spreadsheets-runtime.mjs
          git commit -m 'test: reutilizar fixtures seguros da homologação visual'
          git push origin HEAD:fix/planilhas-1054-homologacao
