name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Aguardar deploy e validar runtime de produção
        shell: bash
        run: |
          set -euo pipefail
          url="https://portal-tcc-enfermagem-ufes.vercel.app/api/health"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              --output "$body" --write-out '%{http_code}' "$url" || true)"

            if [ "$code" = "200" ] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "$body"; then
              echo "Produção saudável: $url"
              cat "$body"
              exit 0
            fi

            if [ "$attempt" -ge 3 ] && [ "$code" = "503" ] && grep -Eq '"code"[[:space:]]*:[[:space:]]*"[A-Z_]+(REQUIRED|ERROR)"' "$body"; then
              echo "Produção respondeu com bloqueio explícito de configuração segura:" >&2
              cat "$body" >&2
              exit 1
            fi

            echo "Tentativa $attempt/24: HTTP ${code:-000}; aguardando o deploy/runtime ficar saudável."
            sleep 10
          done

          echo "Produção não ficou saudável dentro da janela de validação." >&2
          echo "Última resposta HTTP: ${code:-000}" >&2
          cat "$body" >&2 || true
          exit 1
