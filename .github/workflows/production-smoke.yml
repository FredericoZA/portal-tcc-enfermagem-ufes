name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Aguardar deploy e validar runtime de produção
        shell: bash
        run: |
          set -euo pipefail
          origin="https://portal-tcc-enfermagem-ufes.vercel.app"
          url="$origin/api/health"
          expected="$GITHUB_SHA"
          body="$(mktemp)"
          root_body="$(mktemp)"
          root_headers="$(mktemp)"
          trap 'rm -f "$body" "$root_body" "$root_headers"' EXIT

          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              --output "$body" --write-out '%{http_code}' "$url" || true)"

            if ! grep -Eq "\"commit\"[[:space:]]*:[[:space:]]*\"${expected}\"" "$body"; then
              echo "Tentativa $attempt/24: produção ainda não está servindo a revisão ${expected:0:12}; HTTP ${code:-000}."
              sleep 10
              continue
            fi

            if [ "$code" = "200" ] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "$body"; then
              root_code="$(curl --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                --dump-header "$root_headers" --output "$root_body" \
                --write-out '%{http_code}' "$origin/" || true)"

              if [ "$root_code" != "200" ]; then
                echo "API saudável, mas o frontend respondeu HTTP ${root_code:-000}." >&2
                exit 1
              fi

              grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' "$root_headers" || { echo 'Cabeçalho X-Content-Type-Options ausente.' >&2; exit 1; }
              grep -Eqi '^x-frame-options:[[:space:]]*DENY' "$root_headers" || { echo 'Cabeçalho X-Frame-Options ausente.' >&2; exit 1; }
              grep -Eqi '^strict-transport-security:' "$root_headers" || { echo 'Cabeçalho HSTS ausente.' >&2; exit 1; }
              grep -Eqi '^content-security-policy:' "$root_headers" || { echo 'Content-Security-Policy ausente.' >&2; exit 1; }
              grep -Eqi '<!doctype html|<html' "$root_body" || { echo 'Frontend não retornou um documento HTML válido.' >&2; exit 1; }

              echo "Produção saudável na revisão esperada: $url"
              cat "$body"
              exit 0
            fi

            if [ "$code" = "503" ] && grep -Eq '"code"[[:space:]]*:[[:space:]]*"[A-Z_]+(REQUIRED|ERROR)"' "$body"; then
              echo "A revisão esperada chegou à produção, mas está bloqueada por configuração segura:" >&2
              cat "$body" >&2
              exit 1
            fi

            echo "Tentativa $attempt/24: revisão correta respondeu HTTP ${code:-000}; aguardando runtime saudável."
            sleep 10
          done

          echo "A revisão ${expected:0:12} não ficou saudável dentro da janela de validação." >&2
          echo "Última resposta HTTP: ${code:-000}" >&2
          cat "$body" >&2 || true
          exit 1
