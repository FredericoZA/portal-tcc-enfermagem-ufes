name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Aguardar deploy e validar runtime de produção
        shell: bash
        run: |
          set -euo pipefail
          origin="https://portal-tcc-enfermagem-ufes.vercel.app"
          url="$origin/api/health"
          expected="$GITHUB_SHA"
          body="$(mktemp)"
          root_body="$(mktemp)"
          root_headers="$(mktemp)"
          setup_body="$(mktemp)"
          profile_body="$(mktemp)"
          auth_body="$(mktemp)"
          verification_body="$(mktemp)"
          trap 'rm -f "$body" "$root_body" "$root_headers" "$setup_body" "$profile_body" "$auth_body" "$verification_body"' EXIT

          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              --output "$body" --write-out '%{http_code}' "$url" || true)"

            if ! grep -Eq "\"commit\"[[:space:]]*:[[:space:]]*\"${expected}\"" "$body"; then
              echo "Tentativa $attempt/24: produção ainda não está servindo a revisão ${expected:0:12}; HTTP ${code:-000}."
              sleep 10
              continue
            fi

            if [ "$code" = "200" ] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "$body"; then
              root_code="$(curl --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                --dump-header "$root_headers" --output "$root_body" \
                --write-out '%{http_code}' "$origin/" || true)"

              if [ "$root_code" != "200" ]; then
                echo "API saudável, mas o frontend respondeu HTTP ${root_code:-000}." >&2
                exit 1
              fi

              grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' "$root_headers" || { echo 'Cabeçalho X-Content-Type-Options ausente.' >&2; exit 1; }
              grep -Eqi '^x-frame-options:[[:space:]]*DENY' "$root_headers" || { echo 'Cabeçalho X-Frame-Options ausente.' >&2; exit 1; }
              grep -Eqi '^strict-transport-security:' "$root_headers" || { echo 'Cabeçalho HSTS ausente.' >&2; exit 1; }
              grep -Eqi '^content-security-policy:' "$root_headers" || { echo 'Content-Security-Policy ausente.' >&2; exit 1; }
              grep -Eqi '<!doctype html|<html' "$root_body" || { echo 'Frontend não retornou um documento HTML válido.' >&2; exit 1; }

              setup_code="$(curl --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                --output "$setup_body" --write-out '%{http_code}' "$origin/api/setup/status" || true)"
              [ "$setup_code" = "200" ] || { echo "Status de setup respondeu HTTP ${setup_code:-000}." >&2; cat "$setup_body" >&2; exit 1; }
              grep -Eq '"otp"[[:space:]]*:[[:space:]]*\{[[:space:]]*"configured"[[:space:]]*:[[:space:]]*true' "$setup_body" || { echo 'OTP de produção não está configurado.' >&2; cat "$setup_body" >&2; exit 1; }
              grep -Eq '"oauthConfigured"[[:space:]]*:[[:space:]]*true' "$setup_body" || { echo 'Cliente OAuth Google de produção não está configurado.' >&2; cat "$setup_body" >&2; exit 1; }
              grep -Eq '"bootstrapMasterConfigured"[[:space:]]*:[[:space:]]*true' "$setup_body" || { echo 'Master de bootstrap não está configurado.' >&2; cat "$setup_body" >&2; exit 1; }

              profile_code="$(curl --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                --output "$profile_body" --write-out '%{http_code}' "$origin/api/public/installation-profile" || true)"
              [ "$profile_code" = "200" ] || { echo "Perfil institucional respondeu HTTP ${profile_code:-000}." >&2; cat "$profile_body" >&2; exit 1; }
              grep -Eq '"installationId"[[:space:]]*:[[:space:]]*"ufes-enfermagem"' "$profile_body" || { echo 'Perfil institucional ainda não é o da Enfermagem UFES.' >&2; cat "$profile_body" >&2; exit 1; }
              grep -Eq '"institutionAcronym"[[:space:]]*:[[:space:]]*"UFES"' "$profile_body" || { echo 'Sigla institucional UFES ausente no perfil público.' >&2; cat "$profile_body" >&2; exit 1; }
              grep -Eq '"courseAcronym"[[:space:]]*:[[:space:]]*"ENF"' "$profile_body" || { echo 'Sigla do curso ENF ausente no perfil público.' >&2; cat "$profile_body" >&2; exit 1; }

              auth_code="$(curl --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                --header 'x-demo-user-email: tccenfermagemufes@gmail.com' \
                --output "$auth_body" --write-out '%{http_code}' "$origin/api/integrations/status" || true)"
              [ "$auth_code" = "401" ] || { echo "Autenticação demo indevida em produção: HTTP ${auth_code:-000}." >&2; cat "$auth_body" >&2; exit 1; }
              grep -Eq '"code"[[:space:]]*:[[:space:]]*"AUTHENTICATION_REQUIRED"' "$auth_body" || { echo 'Endpoint protegido não devolveu o contrato de autenticação esperado.' >&2; cat "$auth_body" >&2; exit 1; }

              verification_code="$(curl --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                --output "$verification_body" --write-out '%{http_code}' "$origin/api/public/verification/smoke-code-inexistente" || true)"
              [ "$verification_code" = "404" ] || { echo "Consulta pública inválida respondeu HTTP ${verification_code:-000}." >&2; cat "$verification_body" >&2; exit 1; }
              grep -Eq '"valid"[[:space:]]*:[[:space:]]*false' "$verification_body" || { echo 'Consulta pública inválida não retornou valid=false.' >&2; cat "$verification_body" >&2; exit 1; }
              grep -Eq '"status"[[:space:]]*:[[:space:]]*"NOT_FOUND"' "$verification_body" || { echo 'Consulta pública inválida não retornou NOT_FOUND.' >&2; cat "$verification_body" >&2; exit 1; }

              echo "Produção saudável na revisão esperada: $url"
              echo "Setup, perfil UFES, proteção contra auth demo e consulta pública inválida aprovados."
              cat "$body"
              exit 0
            fi

            if [ "$code" = "503" ] && grep -Eq '"code"[[:space:]]*:[[:space:]]*"[A-Z_]+(REQUIRED|ERROR)"' "$body"; then
              echo "A revisão esperada chegou à produção, mas está bloqueada por configuração segura:" >&2
              cat "$body" >&2
              exit 1
            fi

            echo "Tentativa $attempt/24: revisão correta respondeu HTTP ${code:-000}; aguardando runtime saudável."
            sleep 10
          done

          echo "A revisão ${expected:0:12} não ficou saudável dentro da janela de validação." >&2
          echo "Última resposta HTTP: ${code:-000}" >&2
          cat "$body" >&2 || true
          exit 1
