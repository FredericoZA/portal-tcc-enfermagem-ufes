name: Resolve open backlog

on:
  push:
    branches: [main]
    paths:
      - scripts/resolve-open-backlog.mjs
      - .github/workflows/resolve-open-backlog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Aplicar correções de código
        run: node scripts/resolve-open-backlog.mjs
      - name: Reconstruir PNG institucional transparente
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false sharp@0.34.5
          node <<'NODE'
          const sharp = require('sharp');
          (async () => {
            const source = await sharp('public/colenf-logo.svg').metadata();
            await sharp('public/colenf-logo.svg').png({ compressionLevel: 9 }).toFile('/tmp/colenf-logo.png');
            const output = await sharp('/tmp/colenf-logo.png').metadata();
            if (output.format !== 'png') throw new Error('Conversão não produziu PNG.');
            if (!output.hasAlpha) throw new Error('PNG produzido não possui canal alfa.');
            if (!source.width || !source.height || output.width !== source.width || output.height !== source.height) throw new Error('Dimensões/proporção foram alteradas.');
            console.log(`PNG válido: ${output.width}x${output.height}, alpha=${output.hasAlpha}`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          test "$(xxd -p -l 8 /tmp/colenf-logo.png)" = "89504e470d0a1a0a"
          mv /tmp/colenf-logo.png public/colenf-logo.png
      - name: Validar CI
        run: npm run test:ci
      - name: Validar fluxo seguro
        run: npm run test:secure-flow
      - name: Publicar correções
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Portal TCC automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/pages/AvaliacoesPage.tsx server.ts server/integrations/googleDriveArchive.ts server/integrations/googleDriveArchive.test.ts public/colenf-logo.png
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional."
            exit 0
          fi
          git commit -m "fix: resolve pendências restantes de fluxo e identidade"
          git push origin HEAD:main
