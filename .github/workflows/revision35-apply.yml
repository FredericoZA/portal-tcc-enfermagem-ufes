name: Revision 35 apply

on:
  push:
    branches:
      - work/finalizacao-portal-tcc

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[rev35-bot]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/finalizacao-portal-tcc
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: node scripts/revision35-finalize.mjs
      - run: npm run test:ci
      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "portal-tcc-bot"
          git config user.email "portal-tcc-bot@users.noreply.github.com"
          git add src/components/IntegrationStudioPanel.tsx server.ts src/types/index.ts
          git commit -m "feat: concluir Estúdio, acesso e modelos extensíveis [rev35-bot]"
          git push origin HEAD:work/finalizacao-portal-tcc
