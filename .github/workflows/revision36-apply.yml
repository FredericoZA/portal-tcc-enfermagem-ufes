name: Revision 36 apply

on:
  push:
    branches:
      - work/finalizacao-portal-tcc

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[rev36-bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/finalizacao-portal-tcc
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Aplicar revisão 36
        run: node scripts/revision36-complete.mjs
      - name: Validar código e contratos
        run: npm run test:ci
      - name: Validar fluxo seguro
        run: npm run test:secure-flow
      - name: Commitar somente mudanças validadas
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "portal-tcc-bot"
          git config user.email "portal-tcc-bot@users.noreply.github.com"
          git add scripts/test-secure-flow.mjs src/components/UnifiedPortalEditorModal.tsx src/services/apiClient.ts server.ts src/components/IntegrationStudioPanel.tsx src/components/UserSimulatorBar.tsx
          git commit -m "feat: concluir backlog funcional e auditoria [rev36-bot]"
          git push origin HEAD:work/finalizacao-portal-tcc
