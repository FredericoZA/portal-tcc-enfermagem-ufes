name: Ajustar escopo da coluna Etapa

on:
  push:
    branches: [work/ajustes-planilhas-presidente-v1038]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[scope-stage44]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/ajustes-planilhas-presidente-v1038
          fetch-depth: 0
      - name: Aplicar ajuste restrito a Meus TCCs
        run: python scripts/scope-stage44.py
      - name: Commitar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restringir Etapa numérica a Meus TCCs [scope-stage44]"
          git push origin HEAD:work/ajustes-planilhas-presidente-v1038
