name: Security sweep

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Alinhar npm ao packageManager
        run: npm install --global npm@11.9.0
      - name: Instalar dependências reproduzivelmente
        run: npm ci
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Procurar segredos versionados
        run: npm run test:secrets
      - name: Validar tipos e contratos unitários
        run: npm run lint && npm run test:unit
      - name: Validar fluxos de segurança
        run: npm run test:secure-flow
