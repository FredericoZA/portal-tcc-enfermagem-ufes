name: Semantic calendar refactor

on:
  push:
    branches:
      - refactor/semantic-filters-calendar

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/semantic-filters-calendar
          fetch-depth: 0

      - name: Apply deterministic refactor
        run: |
          node scripts/apply-semantic-calendar-refactor.mjs
          node scripts/expand-calendar-summaries.mjs
          node scripts/strengthen-semantic-filter-resolver.mjs

      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/pages/HomePage.tsx src/utils/tableFormatters.ts src/components/PortalVersion1040Enhancer.tsx
          git commit -m "refactor: unifica estado, filtros e cores das defesas"
          git push origin HEAD:refactor/semantic-filters-calendar
