name: Sync lock metadata

on:
  push:
    branches:
      - refactor/spreadsheets-settings-1.0.58
    paths:
      - .github/workflows/sync-lock-metadata.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/spreadsheets-settings-1.0.58
      - name: Sincronizar versão raiz do lockfile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          lock.version = pkg.version;
          if (lock.packages && lock.packages['']) lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit do lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: alinhar package-lock com a versão da aplicação"
          git push origin HEAD:refactor/spreadsheets-settings-1.0.58
