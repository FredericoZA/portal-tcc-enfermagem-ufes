name: Update 34 Block B
on:
  push:
    branches: [update-34-quality-hardening]
    paths:
      - 'scripts/apply-update34-block-b.mjs'
      - '.github/workflows/update34-block-b.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update-34-quality-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar bloco B
        run: node scripts/apply-update34-block-b.mjs
      - name: Validar bloco B
        run: |
          npm ci
          npm run lint
          node --import tsx --test server/update34SessionDraftContract.test.ts
          npm run test:unit
      - name: Consolidar bloco B
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-update34-block-b.mjs .github/workflows/update34-block-b.yml
          git add -A
          git commit -m "Atualização 34 — bloco B: sessão e rascunhos duráveis"
          git push origin HEAD:update-34-quality-hardening
