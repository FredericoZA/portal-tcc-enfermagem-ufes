name: Update 34 Block 1
on:
  push:
    branches: [update-34-quality-hardening]
    paths:
      - 'scripts/apply-update34-block1.mjs'
      - '.github/workflows/update34-block1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: update-34-quality-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar bloco 1
        run: node scripts/apply-update34-block1.mjs
      - name: Validar TypeScript e contratos do bloco
        run: |
          npm ci
          npm run lint
          node --import tsx --test server/update34VisualContract.test.ts
      - name: Consolidar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-update34-block1.mjs .github/workflows/update34-block1.yml
          git add -A
          git commit -m "Atualização 34 — concluir bloco 1 visual"
          git push origin HEAD:update-34-quality-hardening
