name: Update 34 server patch

on:
  push:
    branches:
      - work/finalizacao-portal-tcc
    paths:
      - scripts/apply-update34-server-patch.mjs
      - .github/workflows/update34-server-patch.yml

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/finalizacao-portal-tcc
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar patch cirúrgico da Atualização 34
        run: node scripts/apply-update34-server-patch.mjs
      - name: Registrar patch na branch de trabalho
        run: |
          if git diff --quiet -- server.ts; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "Atualização 34 — corrigir regras de acesso e leitura do Drive"
          git push origin HEAD:work/finalizacao-portal-tcc
